---
# Production environment override
x-app-environment: &app_environment
    APP_DMARC_AGGREGATE_REPORT_EMAIL_RECEIVER_DOMAIN: ${APP_DMARC_AGGREGATE_REPORT_EMAIL_RECEIVER_DOMAIN:?Set APP_DMARC_AGGREGATE_REPORT_EMAIL_RECEIVER_DOMAIN}
    APP_EMAIL_SENDER_ADDRESS: ${APP_EMAIL_SENDER_ADDRESS:?Set APP_EMAIL_SENDER_ADDRESS}
    APP_FRONTEND_URL: ${APP_FRONTEND_URL:?Set APP_FRONTEND_URL}
    APP_INBOUND_REPORT_EMAIL_WEBHOOK_SECRET: ${APP_INBOUND_REPORT_EMAIL_WEBHOOK_SECRET:?Set APP_INBOUND_REPORT_EMAIL_WEBHOOK_SECRET}
    APP_SECRET: ${APP_SECRET:?Set APP_SECRET}
    CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:?Set CORS_ALLOW_ORIGIN}
    DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-app}?serverVersion=${POSTGRES_VERSION:-16}&charset=${POSTGRES_CHARSET:-utf8}
    LOCK_DSN: ${LOCK_DSN:-redis://redis}
    MAILER_DSN: ${MAILER_DSN:?Set MAILER_DSN}
    MESSENGER_ASYNC_HIGH_TRANSPORT_DSN: amqp://${RABBITMQ_DEFAULT_USER:?Set RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/%2f/messages
    MESSENGER_ASYNC_LOW_TRANSPORT_DSN: amqp://${RABBITMQ_DEFAULT_USER:?Set RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/%2f/messages
    REDIS_DSN: ${REDIS_DSN:-redis://redis}
    S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
    S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET}
    S3_ENDPOINT: ${S3_ENDPOINT:?Set S3_ENDPOINT}
    S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
    S3_REGION: ${S3_REGION:?Set S3_REGION}
    S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}

services:
    php:
        build:
            context: .
            target: frankenphp_prod
        environment:
            <<: *app_environment

    worker:
        build:
            context: .
            target: frankenphp_prod
        environment:
            <<: *app_environment

    database:
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-app}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
            POSTGRES_USER: ${POSTGRES_USER:-app}

    rabbitmq:
        environment:
            RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS}
            RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?Set RABBITMQ_DEFAULT_USER}
