framework:
    rate_limiter:
        anonymous_api:
            policy: 'fixed_window'
            limit: 30
            interval: '15 minutes'
            cache_pool: anonymous_api_rate_limiter_pool
        anonymous_sendmail:
            policy: 'fixed_window'
            limit: 3
            interval: '5 minutes'
            cache_pool: anonymous_sendmail_rate_limiter_pool
        logged_in_interaction:
            policy: 'fixed_window'
            limit: 1200
            interval: '1 hour'
            cache_pool: logged_in_api_rate_limiter_pool
        # A wrong two-factor code is not an authentication failure, so login
        # throttling never sees it and the six digits would be free to guess.
        two_factor:
            policy: 'fixed_window'
            limit: 5
            interval: '15 minutes'
            cache_pool: two_factor_rate_limiter_pool
