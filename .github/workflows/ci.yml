name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  tests:
    name: Tests and static analysis
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, dom, fileinfo, gd, iconv, intl, libxml, mbstring, openssl, pdo_sqlite, sodium, sqlite3, zip, zlib
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --no-scripts

      - name: Generate JWT keys for the test suite
        run: |
          mkdir -p config/jwt
          openssl genrsa -out config/jwt/private.pem 4096
          openssl rsa -pubout -in config/jwt/private.pem -out config/jwt/public.pem

      - name: Run tests
        run: vendor/bin/phpunit

      # The mailbox tests read a real IMAP server, whose certificate comes from
      # a throwaway CA, because DMARCo checks every IMAP certificate.
      - name: Start a test IMAP server
        run: tests/Integration/Imap/start-greenmail.sh "$RUNNER_TEMP/imap-test"

      - name: Run the IMAP tests
        env:
          IMAP_TEST_HOST: localhost
          IMAP_TEST_PORT: '3993'
          IMAP_TEST_API: http://localhost:18080
        run: php -d openssl.cafile="$RUNNER_TEMP/imap-test/ca.pem" vendor/bin/phpunit --group imap

      - name: Check code style
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Warm up the container for static analysis
        run: bin/console cache:warmup

      - name: Run static analysis
        run: vendor/bin/psalm --no-progress
